{{- if .Values.networkPolicy.enabled -}}
# Deny cross-tenant traffic (PRD-ARIGAMI-K8S.md §2). Every tenant namespace
# gets one of these: ingress is allowed only from pods in the SAME namespace
# and from the ingress controller's namespace(s) — a pod in another tenant's
# namespace gets nothing, even though the cluster network is flat.
#
# EGRESS has two modes (networkPolicy.egress.mode):
#
#   open        the original posture. Everything is reachable, including every
#               in-cluster Service. Cross-tenant isolation still holds, because
#               the OTHER tenant's ingress rule refuses the connection at the
#               receiving end — but nothing stops this pod from reaching a
#               shared cluster service that has no policy of its own.
#
#   restricted  (default) DNS to the cluster resolver, then the public internet
#               with the RFC1918 ranges and the cloud metadata endpoint carved
#               out. Git, the Anthropic API, OIDC discovery and package
#               registries keep working; the rest of the cluster does not.
#               This is the posture to hand a security review — an agent
#               running with bypassPermissions and a real GitHub token should
#               not be able to reach an unrelated internal service by name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arigami-tenant.fullname" . }}-deny-cross-tenant
  labels:
    {{- include "arigami-tenant.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    {{- range (include "arigami-tenant.ingressNamespaces" . | fromJsonArray) }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{ $.Values.networkPolicy.ingressNamespaceLabelKey }}: {{ . | quote }}
    {{- end }}
  egress:
    {{- if eq .Values.networkPolicy.egress.mode "open" }}
    - {}
    {{- else }}
    # Cluster DNS. Without this nothing resolves and every other rule is moot.
    #
    # Two ways a pod reaches DNS, and a policy must allow both:
    #   - the kube-dns pods themselves (the namespaceSelector), and
    #   - the kube-dns Service IP. With NodeLocal DNSCache (GKE's default) the node answers on that IP locally, so the
    #     packet is never rewritten to a kube-dns pod and the selector above does not match it — every lookup times out
    #     while egress by IP works. The Service IP is read from the cluster when the chart is rendered against one
    #     (`lookup`), and `networkPolicy.egress.dnsServiceCidrs` adds any others.
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabelKey }}: {{ .Values.networkPolicy.egress.dnsNamespace | quote }}
        {{- $dnsSvc := lookup "v1" "Service" .Values.networkPolicy.egress.dnsNamespace "kube-dns" }}
        {{- if and $dnsSvc $dnsSvc.spec $dnsSvc.spec.clusterIP }}
        - ipBlock:
            cidr: {{ printf "%s/32" $dnsSvc.spec.clusterIP }}
        {{- end }}
        {{- range .Values.networkPolicy.egress.dnsServiceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The public internet, minus everything private. `except` entries must be
    # inside the cidr they subtract from, so this is one 0.0.0.0/0 rule rather
    # than a list of public ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.egress.exceptCidrs | nindent 14 }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end -}}
