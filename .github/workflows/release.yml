# B2: build + publish the arigami images to GHCR.
#   push to master  → ghcr.io/maor700/arigami:latest + :sha-<7>
#                     ghcr.io/maor700/arigami-control-plane:latest + :sha-<7>
#   tag v X.Y.Z     → …:X.Y.Z + :X.Y + :sha-<7> for both, plus a GitHub Release
#                     "vX.Y.Z" whose body is that version's CHANGELOG.md section
#                     (VER1 — `bun run release` mints the tag and the section).
#
# Who pushes that tag: normally nobody by hand. version-bump.yml mints it after
# CI goes green on master and then *dispatches this workflow* on the new tag —
# a GITHUB_TOKEN tag push is barred from triggering workflows, so the automated
# path arrives here through workflow_dispatch (with also_latest=true) rather
# than through `on.push.tags`. A human's own `git push --follow-tags` still
# lands on `on.push.tags` as before. Both routes build the same thing.
# amd64 + arm64 via buildx/QEMU. Each image is smoke-tested on amd64 before push.
#
# Two images, one repo: the tenant runtime (root Dockerfile) and the
# control-plane that provisions tenants (control-plane/Dockerfile). The
# control-plane build uses the REPO ROOT as context on purpose — it bakes
# deploy/helm/arigami-tenant into the image, so a control-plane can never
# install a chart revision it was not built against (deploy/helm/
# arigami-control-plane/README.md).
name: Release image
on:
  push:
    branches: [master]
    # v0.0.0-ci* is desktop.yml's CI-test tag (a branch build of the
    # installers); it is not a version and must publish no images.
    tags: ['v*', '!v0.0.0-ci*']
  workflow_dispatch:
    inputs:
      # version-bump.yml dispatches this workflow on the tag it just minted, and
      # asks for `latest` along with the semver tags. Without it `latest` would
      # still be the build from *before* the version bump — the images would
      # ship a VERSION one release behind, and a Docker install polling
      # /__api/version would never see itself as up to date. Off for a plain
      # manual dispatch, and a `push` event carries no inputs at all, so the
      # existing "latest = master" behaviour is untouched.
      also_latest:
        description: Also publish this build as :latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CP_IMAGE: ghcr.io/${{ github.repository }}-control-plane

jobs:
  # Spec §0.1(8) / B2: a public `latest` is only legal with auth on by default.
  # Fail the whole release if server/lib/config.ts's default auth mode is not
  # `pairing` — nobody should be able to ship an open image by accident.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: default auth mode must be pairing
        run: |
          if ! grep -Eq "^\s*mode:\s*'pairing'," server/lib/config.ts; then
            echo "::error::server/lib/config.ts default auth mode is not 'pairing' — refusing to publish"; exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: sh scripts/check-public-readiness.sh

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.also_latest }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=arigami
            org.opencontainers.image.licenses=Apache-2.0

      # amd64 only, loaded into the local daemon, for the smoke test below.
      - name: build amd64 (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke — host answers, pairing on, desktop up
        run: |
          set -eux
          docker run -d --name smoke --shm-size 1g -p 127.0.0.1:3099:3099 \
            -e ARIGAMI_BIND=0.0.0.0 ${IMAGE}:smoke
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3099/__api/config >/tmp/cfg.json 2>/dev/null && break; sleep 2
          done
          cat /tmp/cfg.json; echo
          grep -q '"authMode":"pairing"' /tmp/cfg.json
          docker logs smoke 2>&1 | grep -q 'pairing code'
          docker exec smoke sh -c 'pgrep -x Xvfb && pgrep -x x11vnc'
          docker exec smoke sh -c '"$CHROME_BIN" --no-sandbox --headless --version'
          docker rm -f smoke

      - name: build + push amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The control-plane image. Independent of `build`: it shares only the gate,
  # so a tenant-image failure does not hide a control-plane failure (and the
  # two build in parallel).
  build-control-plane:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CP_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.also_latest }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=arigami-control-plane
            org.opencontainers.image.licenses=Apache-2.0

      - name: build amd64 (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.CP_IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What the smoke test is actually asserting, in order: the image runs as
      # a non-root uid (the chart pins runAsUser 1000 and a root pass would
      # fail `restricted` PSS); helm and kubectl are on PATH, because
      # provisioner.ts shells out to them and their absence is an ENOENT at
      # provision time, not at boot; the baked tenant chart is present AND
      # renders; and the service comes up and serves /__health, which is what
      # the chart's probes hit.
      - name: smoke — non-root, helm+kubectl present, baked chart renders, /__health
        run: |
          set -eux
          test "$(docker run --rm ${CP_IMAGE}:smoke id -u)" = 1000
          docker run --rm ${CP_IMAGE}:smoke helm version --short
          docker run --rm ${CP_IMAGE}:smoke kubectl version --client
          docker run --rm ${CP_IMAGE}:smoke \
            helm template t /charts/arigami-tenant \
              --set tenant.id=smoke --set ingress.domain=example.test \
              --set 'networkPolicy.ingressNamespaces={kube-system}' >/dev/null

          # /data must be writable by uid 1000; the chart does this with
          # fsGroup, docker needs the volume pre-owned.
          d=$(mktemp -d); chmod 777 "$d"
          docker run -d --name cp-smoke -v "$d":/data \
            -e CP_ORG_DOMAIN=example.test -e CP_RECONCILE_SEC=0 -e CP_BACKUP_INTERVAL_SEC=0 \
            -p 127.0.0.1:8090:8090 ${CP_IMAGE}:smoke
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8090/__health >/tmp/h.json 2>/dev/null && break; sleep 2
          done
          cat /tmp/h.json; echo
          grep -q '"ok":true' /tmp/h.json
          test -f "$d/control-plane.db"   # sqlite landed on the volume, not the image layer
          docker rm -f cp-smoke

      - name: build + push amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # VER1: the tag push publishes the release notes. `bun run release` wrote the
  # CHANGELOG section and the annotated tag; here the section becomes the
  # Release body (VERSION must agree with the tag — a mis-tagged commit fails).
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag but VERSION says $ver — mint tags with 'bun run release'"; exit 1; }
      - name: release notes from CHANGELOG.md
        run: bun scripts/release.ts notes "$GITHUB_REF_NAME" > /tmp/notes.md && cat /tmp/notes.md
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
          fi
