name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun install
        working-directory: web
      - run: bun test
      - run: bun run typecheck
        continue-on-error: true
      - run: sh scripts/check-public-readiness.sh
