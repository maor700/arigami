# Single-node run of arigami on Docker.
#
# This mirrors the eventual K8s shape on purpose: ONE container, ONE named
# volume (= the PVC), config from an env file (= a Secret). There is no second
# replica — the listeners scheduler in server/state.ts is a singleton and the
# sessions write git worktrees; two of these on the same volume corrupt state.
#
#   cp docker/.env.example .env   # Claude auth (see the file)
#   docker compose up -d          # pulls ghcr.io/maor700/arigami:latest
#   docker compose logs -f arigami   # prints the one-time pairing code
#   open http://localhost:3199/__host/
#
# Pin a release with ARIGAMI_TAG=0.1.0 (or sha-<7>) in .env.
#
# Building the image yourself (developers) — the `build` profile:
#   docker compose --profile build build     # tags the same image name locally
#   docker compose up -d                     # then runs it as usual
#
# TLS (C2): add ARIGAMI_DOMAIN + ARIGAMI_PUBLIC_URL to .env, then
#   docker compose --profile tls up -d
# → Caddy on :80/:443 with a Let's Encrypt certificate, proxying to the
# arigami container over the compose network. See docs/TLS.md.

x-arigami: &arigami
  image: ghcr.io/maor700/arigami:${ARIGAMI_TAG:-latest}
  environment:
    ARIGAMI_PORT: "3199"
    ARIGAMI_BIND: "0.0.0.0"
    # Caddy is NOT a loopback peer from inside this container, so the
    # X-Forwarded-Proto rule (trustProxy, loopback-only) can't apply here;
    # the https origin comes from ARIGAMI_PUBLIC_URL in .env instead.
    ARIGAMI_TRUST_PROXY: "0"
  env_file:
    - .env
  volumes:
    - arigami-data:/data
  # Chrome (the VNC desktop + Playwright) crashes on the default 64MB /dev/shm.
  # With --no-sandbox (added automatically inside the container) no extra
  # capabilities are needed.
  shm_size: "1gb"

services:
  arigami:
    <<: *arigami
    container_name: arigami
    # Port 3199 on the host: a natively installed host (bin/host install) may
    # already own localhost:3099. The container listens on 3199 INTERNALLY too
    # (ARIGAMI_PORT) so self-built URLs (OAuth redirect_uri) point back at the
    # container, not at a native host on :3099.
    # Published on the host's LOOPBACK only (C1 fail-closed, SPEC §7.9): reach
    # it from other machines through `tailscale serve` or the `tls` profile
    # below, never by exposing this port. Inside the container the host binds
    # 0.0.0.0 so both the port map and the caddy service can reach it; auth
    # (pairing cookie) stays on — config.ts refuses 0.0.0.0 with auth off.
    ports:
      - "127.0.0.1:3199:3199"
    restart: unless-stopped

  # --- local image build — only with `docker compose --profile build build` ---
  # Same image name/tag as the service above, so a local build shadows the
  # registry image. Never started as a second host: its command exits at once.
  arigami-build:
    <<: *arigami
    profiles: [build]
    build:
      context: .
      args:
        # WHATSAPP_MCP_REF: <commit>   # override the pinned whatsapp-mcp checkout
    container_name: arigami-build
    entrypoint: ["/bin/true"]
    command: []
    restart: "no"

  # --- TLS edge (C2) — only with `docker compose --profile tls up` ---------
  # Caddy with the caddy-ratelimit module (deploy/caddy/Dockerfile). To use
  # stock caddy instead: `image: caddy:2`, drop `build`, mount deploy/caddy at
  # /etc/caddy and set ARIGAMI_RATELIMIT_FILE=ratelimit-off.caddy.
  caddy:
    profiles: [tls]
    build: deploy/caddy
    image: arigami-caddy:local
    container_name: arigami-caddy
    depends_on:
      - arigami
    ports:
      - "80:80"     # ACME HTTP-01 + http→https redirect
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # Public hostname (DNS → this machine). REQUIRED for the profile; the
      # same name must be in ARIGAMI_PUBLIC_URL=https://<domain> in .env.
      ARIGAMI_DOMAIN: ${ARIGAMI_DOMAIN:?set ARIGAMI_DOMAIN in .env for the tls profile}
      ARIGAMI_UPSTREAM: arigami:3199
      ARIGAMI_RATELIMIT_FILE: ${ARIGAMI_RATELIMIT_FILE:-ratelimit.caddy}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - caddy-data:/data      # certificates + ACME account (keep across restarts!)
      - caddy-config:/config
    restart: unless-stopped

volumes:
  arigami-data:
  caddy-data:
  caddy-config:
