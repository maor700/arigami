<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The setup bar: shown until there are two URLs to compare, and reachable
       again from the ⚙ button. A tab opened from the tab bar or /compare has no
       query at all, so this is the normal entry point. -->
  <form id="setup" hidden>
    <div class="row">
      <label for="ua">Under review</label>
      <input id="ua" type="url" dir="ltr" placeholder="http://…:3000/some/path" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <label for="ub">Baseline</label>
      <input id="ub" type="url" dir="ltr" placeholder="https://baseline.example.com" autocomplete="off" spellcheck="false">
    </div>
    <div class="row actions">
      <button type="submit" id="go">Compare</button>
      <span id="hint"></span>
    </div>
  </form>

  <div id="view" hidden>
    <div id="bwrap"><iframe id="fB" title="baseline"></iframe></div>
    <div id="awrap"><iframe id="fA" title="under review"></iframe></div>
    <div id="dv"><div class="grab"></div><div class="knob">⇆</div></div>
    <div class="lbl" id="lblB" style="left:12px"></div>
    <div class="lbl" id="lblA" style="right:12px"></div>
    <div id="bar">
      <button type="button" id="syncbtn"></button>
      <button type="button" id="askbtn" title="Send both URLs to the session">↩ ask the session</button>
      <button type="button" id="editbtn" title="Change the URLs">⚙</button>
    </div>
    <div id="bnotice">
      <div style="font-size:26px">⚠</div>
      <div class="t">The baseline isn't logged in</div>
      <div class="s">This page's SSO can't complete through the host proxy — its login rejects the proxy's redirect URI, so it loops. Open it directly to view, or log in there first and retry.</div>
      <div class="btns">
        <button type="button" id="bopen" class="primary">Open directly ↗</button>
        <button type="button" id="bretry">Retry</button>
      </div>
    </div>
  </div>

  <script src="/__ext-sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
