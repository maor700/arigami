<!doctype html>
<html lang="en" dir="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>From PR — Arigami</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0; padding: 18px; line-height: 1.5; font-size: 13px;
        background: Canvas; color: CanvasText;
      }
      label { display: block; margin-bottom: 12px; }
      .lbl { display: block; margin-bottom: 4px; font-size: 9.5px; letter-spacing: .06em;
        text-transform: uppercase; opacity: .65; font-family: ui-monospace, monospace; }
      input, select, textarea {
        width: 100%; padding: 7px 9px; border-radius: 7px; font: inherit;
        border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit;
      }
      textarea { min-height: 96px; resize: vertical; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
      .row > label { flex: 1 1 140px; margin-bottom: 0; }
      button { padding: 7px 14px; border-radius: 7px; font: inherit; cursor: pointer;
        border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; }
      button:hover:not(:disabled) { background: rgba(128,128,128,.12); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { font-weight: 700; border-color: CanvasText; }
      ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 300px; overflow: auto;
        border: 1px solid rgba(128,128,128,.25); border-radius: 8px; }
      li { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid rgba(128,128,128,.18); }
      li:last-child { border-bottom: 0; }
      li:hover, li[aria-selected="true"] { background: rgba(128,128,128,.14); }
      .num { font-family: ui-monospace, monospace; opacity: .6; margin-right: 6px; }
      .meta { font-size: 11px; opacity: .6; margin-top: 2px; }
      .note { font-size: 11.5px; opacity: .7; margin: 8px 0 0; }
      .err { color: #b3261e; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
      hr { border: 0; border-top: 1px solid rgba(128,128,128,.25); margin: 16px 0; }
    </style>
  </head>
  <body>
    <label>
      <span class="lbl">Pull request</span>
      <input id="pr" placeholder="Paste a PR URL, or owner/repo#123 — or pick one below" autofocus />
    </label>

    <div class="row">
      <label>
        <span class="lbl">Repository</span>
        <select id="repo"><option value="">Loading…</option></select>
      </label>
      <label style="flex: 0 0 110px">
        <span class="lbl">State</span>
        <select id="state">
          <option value="open">Open</option>
          <option value="all">All</option>
          <option value="merged">Merged</option>
          <option value="closed">Closed</option>
        </select>
      </label>
      <label style="flex: 0 0 120px">
        <span class="lbl">Author</span>
        <input id="author" placeholder="anyone" />
      </label>
      <button id="refresh" type="button">Refresh</button>
    </div>

    <ul id="pulls" hidden></ul>
    <p class="note" id="pullsNote"></p>

    <hr />

    <div class="row">
      <label style="flex: 0 0 180px">
        <span class="lbl">Checkout</span>
        <select id="mode">
          <option value="worktree">Check the PR out</option>
          <option value="nocheckout">Diff only, touch nothing</option>
        </select>
      </label>
      <label style="flex: 0 0 150px">
        <span class="lbl">Permissions</span>
        <select id="perm">
          <option value="bypassPermissions">Bypass</option>
          <option value="acceptEdits">Accept edits</option>
          <option value="plan">Plan</option>
          <option value="default">Ask</option>
        </select>
      </label>
    </div>

    <label style="margin-top: 12px">
      <span class="lbl">First message</span>
      <textarea id="prompt" placeholder="Pick a pull request first"></textarea>
    </label>

    <div class="row">
      <button id="start" class="primary" type="button" disabled>Start review</button>
      <span class="note" id="agentNote"></span>
    </div>
    <div class="err" id="err" hidden></div>

    <script src="/__ext-sdk.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const err = (msg) => { $('err').hidden = !msg; $('err').textContent = msg || ''; };

      // The human may have typed over the generated prompt; never clobber that.
      let promptEdited = false;
      $('prompt').addEventListener('input', () => { promptEdited = true; });

      let ctx = null;
      let selected = null; // {url, slug, number}

      function parseRef(s) {
        s = String(s || '').trim();
        if (!s) return null;
        let m = /^([\w.-]+\/[\w.-]+)#(\d+)$/.exec(s);
        if (m) return { slug: m[1], number: +m[2], url: `https://github.com/${m[1]}/pull/${m[2]}` };
        m = /(?:^|\/\/[^/]+\/)([\w.-]+\/[\w.-]+)\/(?:pull|pulls)\/(\d+)/.exec(s);
        if (m) return { slug: m[1], number: +m[2], url: s };
        return null;
      }

      function defaultPrompt(url, mode) {
        const checkout =
          mode === 'nocheckout'
            ? 'Do NOT check the branch out. Read the diff with `gh pr diff` and review from that alone.'
            : 'Check the PR out into its own worktree (`gh pr checkout`) so you can read the code around each change.';
        return [
          `Review the pull request ${url}.`,
          '',
          checkout,
          '',
          "This is somebody else's pull request. Do not modify, stage, commit or push any code — the output of this session is a review, nothing else.",
          '',
          'Put each finding in the Changes tab as an inline comment on the line it belongs to. Run `pr_import_comments` first, so you do not repeat a point somebody already made.',
        ].join('\n');
      }

      function refreshPrompt() {
        const ref = parseRef($('pr').value);
        $('start').disabled = !ref;
        if (!ref) return;
        if (!promptEdited) $('prompt').value = defaultPrompt(ref.url, $('mode').value);
      }
      $('pr').addEventListener('input', () => { promptEdited = false; refreshPrompt(); });
      $('mode').addEventListener('change', refreshPrompt);

      async function loadRepos() {
        const r = await arigami.runTool('pr_list_repos', {});
        const sel = $('repo');
        sel.innerHTML = '';
        const repos = (r && r.repos) || [];
        if (!repos.length) {
          sel.innerHTML = '<option value="">No repositories</option>';
          err(r && r.error ? `Could not list repositories: ${r.error}` : '');
          return;
        }
        for (const x of repos) {
          const o = document.createElement('option');
          o.value = o.textContent = x.slug;
          sel.appendChild(o);
        }
        loadPulls();
      }

      async function loadPulls() {
        const repo = $('repo').value;
        if (!repo) return;
        $('pullsNote').textContent = 'Loading pull requests…';
        $('pulls').hidden = true;
        const r = await arigami.runTool('pr_list_pulls', {
          repo,
          state: $('state').value,
          author: $('author').value.trim() || undefined,
        });
        const pulls = (r && r.pulls) || [];
        const ul = $('pulls');
        ul.innerHTML = '';
        if (r && r.error) { $('pullsNote').textContent = ''; err(r.error); return; }
        err('');
        if (!pulls.length) { $('pullsNote').textContent = 'No pull requests match.'; return; }
        $('pullsNote').textContent = '';
        for (const p of pulls) {
          const li = document.createElement('li');
          li.tabIndex = 0;
          li.innerHTML =
            `<div><span class="num">#${p.number}</span>${escapeHtml(p.title)}${p.draft ? ' · draft' : ''}</div>` +
            `<div class="meta">${escapeHtml(p.author || '')} · ${escapeHtml(p.branch || '')}</div>`;
          const pick = () => {
            for (const el of ul.children) el.removeAttribute('aria-selected');
            li.setAttribute('aria-selected', 'true');
            $('pr').value = p.url;
            promptEdited = false;
            refreshPrompt();
          };
          li.addEventListener('click', pick);
          li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
          ul.appendChild(li);
        }
        ul.hidden = false;
      }

      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      $('repo').addEventListener('change', loadPulls);
      $('state').addEventListener('change', loadPulls);
      $('author').addEventListener('change', loadPulls);
      $('refresh').addEventListener('click', loadPulls);

      $('start').addEventListener('click', async () => {
        const ref = parseRef($('pr').value);
        if (!ref) return;
        $('start').disabled = true;
        err('');
        try {
          const agent = String((ctx && ctx.settings && ctx.settings.agent) || '').trim();
          await arigami.createSession({
            title: `Review ${ref.slug}#${ref.number}`,
            prompt: $('prompt').value,
            permissionMode: $('perm').value,
            ...(agent ? { agent } : {}),
            // prNumber is the key the host already reads: it is what makes the
            // published review land on THIS PR instead of "the open PR for the
            // current branch".
            metadata: { pr: ref.url, prNumber: ref.number, repo: ref.slug, reviewMode: $('mode').value },
          });
          // The cockpit closes the launcher and opens the session from here.
        } catch (e) {
          err(String((e && e.message) || e));
          $('start').disabled = false;
        }
      });

      (async () => {
        ctx = await arigami.ready();
        // A launcher tab: no session yet. If this ever renders inside a session
        // the buttons would fail at the last step, so say so up front.
        if (ctx.sessionId !== null) {
          err('This tab is meant for the launcher — open it from "New session".');
          return;
        }
        const agent = String((ctx.settings && ctx.settings.agent) || '').trim();
        $('agentNote').textContent = agent ? `as agent "${agent}"` : 'no review agent configured (Settings › Extensions)';
        if (ctx.settings && ctx.settings.reviewMode === 'nocheckout') $('mode').value = 'nocheckout';
        await loadRepos();
        refreshPrompt();
      })().catch((e) => err(String((e && e.message) || e)));
    </script>
  </body>
</html>
